StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Ravn

# Default Markdown is off so AGENTS.md, CLAUDE.md, VISION.md, skills, and
# references stay outside the gate. User-facing docs take the house style.
[*.md]
BasedOnStyles =

[{README.md,plugins/*/*/README.md}]
BasedOnStyles = Ravn, write-good
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.ThereIs = warning
write-good.So = warning
