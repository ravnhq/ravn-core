# Re-run prepare so existing checkouts install and refresh the push guard.
optimisticRepeatInstall: false
# One virtual store per machine: each checkout's node_modules holds only
# symlinks into it, so a git worktree's install costs about 1 MB.
virtualStoreType: global
# Existing checkouts switch to that layout on their next pnpm command; the
# default confirmation prompt aborts where there is no TTY.
confirmModulesPurge: false
allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
overrides:
  basic-ftp: ^6.2.4
  jks-js: "-"
  "@openai/codex": 0.159.0
  "@modelcontextprotocol/sdk": ^1.32.1
  follow-redirects: ^1.16.2
  "@hono/node-server": ^2.1.6
  qs: ^6.16.1
  fast-xml-parser: ^5.12.0
  mongoose: ^9.11.4
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
